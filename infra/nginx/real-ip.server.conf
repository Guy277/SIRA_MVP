# Serveur de test seulement (monté par infra/compose.server.yaml) : Nginx est derrière Caddy.
# On croit X-Forwarded-For uniquement quand la requête vient du réseau privé des conteneurs,
# c'est-à-dire de Caddy ; $remote_addr redevient alors l'adresse du voyageur.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
