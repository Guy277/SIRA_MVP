events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  sendfile on;
  gzip on;
  gzip_types application/json application/javascript text/css text/plain;

  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;

  # Seule l'API est joignable : SIRA-MORE, les comptes et la voix restent privés derrière elle.
  upstream sira_api { server api:4000; }

  server {
    listen 80;
    server_name _;
    client_max_body_size 8m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(self), microphone=(self)" always;

    location /api/ {
      limit_req zone=api_limit burst=30 nodelay;
      proxy_pass http://sira_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
      proxy_pass http://sira_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }

    # Appli web exportée (mobile/dist, npx expo export -p web) : une seule page, les adresses
    # de l'appli (/privacy, /chat…) renvoient index.html et expo-router affiche le bon écran.
    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
    }
  }
}
