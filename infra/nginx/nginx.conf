events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  sendfile on;
  gzip on;
  gzip_types application/json application/javascript text/css text/plain;

  # Serveur de test derrière Caddy : adresse réelle du voyageur (infra/nginx/real-ip.server.conf).
  # En local, aucun fichier ne correspond et rien ne change.
  include /etc/nginx/conf.d/real-ip*.conf;

  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;

  # Seule l'API est joignable : SIRA-MORE, les comptes et la voix restent privés derrière elle.
  upstream sira_api { server api:4000; }

  server {
    listen 80;
    server_name _;
    client_max_body_size 8m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(self), microphone=(self)" always;

    location /api/ {
      limit_req zone=api_limit burst=30 nodelay;
      proxy_pass http://sira_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
      proxy_pass http://sira_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }

    # Appli web exportée (mobile/dist, npx expo export -p web) : une seule page, les adresses
    # de l'appli (/privacy, /chat…) renvoient index.html et expo-router affiche le bon écran.
    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
      # La page (index.html, manifeste) est toujours redemandée : sans cela, Safari et l'icône de l'écran
      # d'accueil de l'iPhone gardaient l'ancienne version après une mise à jour (vu le 2026-11-08).
      # Les scripts de _expo/ changent de nom à chaque export : eux peuvent rester en cache.
      # expires epoch donne « Cache-Control: no-cache » ; un add_header ici effacerait ceux du serveur
      # (nosniff, Permissions-Policy du micro et du GPS), Nginx n'héritant pas des add_header d'un bloc à l'autre.
      expires epoch;
    }

    # Fichiers de l'export (scripts, polices, images) : un fichier absent est une vraie 404. Renvoyer
    # index.html à la place, le navigateur le garderait en cache comme police (icônes en carrés vides).
    location ~ ^/(_expo|assets)/ {
      root /usr/share/nginx/html;
      try_files $uri =404;
    }
  }
}
