events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  sendfile on;
  gzip on;
  gzip_types application/json application/javascript text/css text/plain;

  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;

  upstream sira_web { server web:3000; }
  upstream sira_api { server api:4000; }
  upstream sira_ai { server ai:8000; }

  server {
    listen 80;
    server_name _;
    client_max_body_size 8m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(self), microphone=(self)" always;

    location /api/ {
      limit_req zone=api_limit burst=30 nodelay;
      proxy_pass http://sira_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
      proxy_pass http://sira_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }

    location /ai/ {
      rewrite ^/ai/(.*)$ /$1 break;
      proxy_pass http://sira_ai;
    }

    location / {
      proxy_pass http://sira_web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
