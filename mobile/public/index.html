<!DOCTYPE html>
<!-- SIRA's web page (Expo template, customised). The app is in French (app.json web.lang = fr)
     and must never be machine-translated: Chrome and Safari translated it « from English »,
     which changed the words (« Assistante vocale », « vous ») and broke the icon font
     (the microphone showed as « 1 »). -->
<html lang="fr" translate="no">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- maximum-scale=1 : Safari ne zoome plus sur un champ touché (texte de moins de 16 px). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no" />
    <meta name="google" content="notranslate" />
    <title>%WEB_TITLE%</title>
    <!-- « Sur l'écran d'accueil » (iPhone) / « Installer l'appli » (Android) : icône SIRA et ouverture en plein
         écran, sans les barres du navigateur, comme une appli. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SIRA" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#010101" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Écran de chargement : visible dès la première seconde, pendant que l'appli se télécharge (au lieu d'une page
         blanche). L'appli le retire quand son premier écran est prêt (app/_layout.tsx). */
      #sira-loader {
        position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 18px; padding: 24px; background: #010101; color: #ffffff; text-align: center;
        font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      }
      #sira-loader img { width: 88px; height: 88px; border-radius: 20px; }
      #sira-loader-spinner {
        width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(242, 101, 34, 0.25);
        border-top-color: #f26522; animation: sira-turn 0.9s linear infinite;
      }
      #sira-loader-text { font-size: 15px; line-height: 1.5; color: #d1d5db; max-width: 300px; }
      #sira-loader.sira-old #sira-loader-spinner { display: none; }
      #sira-loader.sira-old #sira-loader-text { color: #ffffff; }
      @keyframes sira-turn { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #sira-loader-spinner { animation-duration: 3s; } }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      Active JavaScript pour utiliser SIRA.
    </noscript>
    <div id="sira-loader" class="notranslate" role="status" aria-live="polite">
      <img src="/apple-touch-icon.png" alt="SIRA" />
      <div id="sira-loader-spinner"></div>
      <div id="sira-loader-text">Chargement de SIRA…</div>
    </div>
    <!-- Navigateur trop ancien (avant Chrome 85, août 2020) : l'appli ne peut pas démarrer, on le dit au lieu de
         laisser une page blanche. Écrit en JavaScript ancien pour tourner partout. Connexion lente : on rassure. -->
    <script>
      (function () {
        var text = document.getElementById('sira-loader-text');
        var supported = true;
        try { new Function('var a = null; a ??= 1; class B { #c = 1; d = 2; }'); } catch (error) { supported = false; }
        if (!supported) {
          document.getElementById('sira-loader').className = 'sira-old';
          text.innerHTML = 'Ton navigateur est trop ancien pour SIRA.<br><br>Mets à jour <b>Chrome</b> depuis le Play Store, '
            + 'ou ouvre ce lien dans <b>Firefox</b> ou <b>Safari</b>.';
          return;
        }
        setTimeout(function () {
          if (document.getElementById('sira-loader')) text.innerHTML = 'Connexion lente : SIRA se charge,<br>patiente encore un peu…';
        }, 15000);
      })();
    </script>
    <!-- The root element for your Expo app. -->
    <div id="root" class="notranslate"></div>
  </body>
</html>
