<!DOCTYPE html>
<!-- SIRA's web page (Expo template, customised). The app is in French (app.json web.lang = fr)
     and must never be machine-translated: Chrome and Safari translated it « from English »,
     which changed the words (« Assistante vocale », « vous ») and broke the icon font
     (the microphone showed as « 1 »). -->
<html lang="fr" translate="no">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- maximum-scale=1 : Safari ne zoome plus sur un champ touché (texte de moins de 16 px). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no" />
    <meta name="google" content="notranslate" />
    <title>%WEB_TITLE%</title>
    <!-- « Sur l'écran d'accueil » (iPhone) / « Installer l'appli » (Android) : icône SIRA et ouverture en plein
         écran, sans les barres du navigateur, comme une appli. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="SIRA" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#010101" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      Active JavaScript pour utiliser SIRA.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root" class="notranslate"></div>
  </body>
</html>
